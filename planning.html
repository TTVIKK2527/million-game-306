<!doctype html><html lang="et"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Miljonimängu töölaud</title><style>body{font:16px system-ui;max-width:1250px;margin:2rem auto;padding:1rem;background:#faf9f6;color:#222}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem}section{background:#e9e7e2;padding:1rem;border-radius:8px}article{background:white;padding:1rem;margin:1rem 0;border:1px solid #ccc}select{max-width:100%;padding:.5rem}h2{font-size:1.1rem}small{display:block}</style><h1>Miljonimängu töölaud</h1><p><a href="index.html">Mängu juurde</a> · Olekud salvestuvad ainult selles brauseris. See töölaud loodi 16.11.2026; see ei tõenda varasemat meeskonnatööd.</p><p>Valmis: vastuvõtukriteeriumid täidetud, asjakohased testid läbivad, kood üle vaadatud ja brauseri töövoog läbi proovitud.</p><main id="board"></main><script>
const columns=['Backlog','Valmis alustamiseks','Töös','Ülevaatus','Valmis'];
const stories=[
['MG-1',3,'Õppijana valin lähtekoodi ülesande','Numbrilised kaustad leitakse lünkadega; kirjeldus ja kõik sobivad lahendusfailid laaditakse.'],
['MG-2',5,'Õppijana vastan tasakaalus küsimustele','15 küsimust: 5 lihtsat, 5 keskmist ja 5 rasket; valikud ja selgitused jäävad segamisel kokku.'],
['MG-3',3,'Õppijana saan selge tagasiside','Iga vastuse selgitus on nähtav; uus küsimus algab alles nupust.'],
['MG-4',3,'Mängijana kasutan õlekõrsi','Iga õlekõrs üks kord; 50:50 jätab õige valiku; publiku summa alati 100%.'],
['MG-5',3,'Mängijana näen teenitud summat','Skoor näitab saavutatut; eksimine jätab turvataseme; võit annab miljoni.'],
['MG-6',5,'Arendajana vahetan küsimuste pakkujat','Simulatsioon selgelt eristatud; sisendiks ülesanne ja lahendusfailid; päris API võtit avalikus koodis pole.'],
['MG-7',2,'Kasutajana saan mängida telefonis','Nupud kasutatavad kitsal ekraanil, tekst loetav, heli juhitav.'],
['MG-8',2,'Õpetajana saan avaliku projektilingi','Repositoorium, töölaud ja käivitusjuhend kättesaadavad; avaldamine kontrollitud.']];
let saved={};try{saved=JSON.parse(localStorage.getItem('million-kanban')||'{}')}catch{}
function draw(){let board=document.querySelector('#board');board.replaceChildren();for(const column of columns){let section=document.createElement('section'),h=document.createElement('h2');h.textContent=column;section.append(h);for(const [id,points,title,accept] of stories){let state=saved[id]||(id==='MG-8'?'Valmis alustamiseks':'Ülevaatus');if(state!==column)continue;let card=document.createElement('article'),heading=document.createElement('h3'),p=document.createElement('p'),small=document.createElement('small'),select=document.createElement('select');heading.textContent=title;p.textContent=accept;small.textContent=`${id} · ${points} punkti`;select.setAttribute('aria-label',`${id} olek`);for(const c of columns){let option=document.createElement('option');option.textContent=c;option.selected=c===state;select.append(option)}select.onchange=()=>{saved[id]=select.value;try{localStorage.setItem('million-kanban',JSON.stringify(saved))}catch{alert('Salvestamine ebaõnnestus.')}draw()};card.append(small,heading,p,select);section.append(card)}board.append(section)}}draw();
</script></html>
