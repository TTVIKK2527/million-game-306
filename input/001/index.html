<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulaator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator">
    <h1>Kalkulaator</h1>
    <div class="display" id="result">0</div>
    <div class="inputs">
      <input type="text" id="num1" placeholder="Esimene arv">
      <select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">×</option>
        <option value="/">÷</option>
      </select>
      <input type="text" id="num2" placeholder="Teine arv">
    </div>
    <button id="calculate-btn">Arvuta</button>
    <div class="error" id="error"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
